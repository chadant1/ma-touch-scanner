name: Build desktop app

# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0
# to also publish a GitHub Release with the downloads attached.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    env:
      PYI_FLAGS: >-
        --noconfirm --exclude-module pyqtgraph.examples --exclude-module tkinter
        --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtQuick
        --exclude-module PySide6.QtQml --exclude-module PySide6.Qt3DCore
        --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtPdf
        --collect-all curl_cffi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pyinstaller $PYI_FLAGS --onefile --windowed --name "MA-Touch-Scanner" main.py
          mv dist/MA-Touch-Scanner.exe dist/MA-Touch-Scanner-Windows.exe

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pyinstaller $PYI_FLAGS --windowed --name "MA Touch Scanner" --osx-bundle-identifier com.matouchscanner.app main.py
          "dist/MA Touch Scanner.app/Contents/MacOS/MA Touch Scanner" --selftest
          cd dist && ditto -c -k --keepParent "MA Touch Scanner.app" MA-Touch-Scanner-macOS.zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pyinstaller $PYI_FLAGS --onefile --name MA-Touch-Scanner-Linux main.py
          ./dist/MA-Touch-Scanner-Linux --selftest

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\MA-Touch-Scanner-Windows.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MA-Touch-Scanner-${{ matrix.label }}
          path: |
            dist/MA-Touch-Scanner-Windows.exe
            dist/MA-Touch-Scanner-macOS.zip
            dist/MA-Touch-Scanner-Linux
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MA-Touch-Scanner-Windows.exe
            dist/MA-Touch-Scanner-macOS.zip
            dist/MA-Touch-Scanner-Linux
